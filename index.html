<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Osteo-Intel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+Thai:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#f2efe8;--sf:#fbf9f4;--tx:#1d1b18;--mt:#6e685d;--ln:#d9d3c5;--ac:#7c2b2b;--br:#7d6428;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0d0c;--sf:#161514;--tx:#e4dfd3;--mt:#8f897c;--ln:#2a2825;--ac:#b4524a;--br:#b69a64;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0d0c;--sf:#161514;--tx:#e4dfd3;--mt:#8f897c;--ln:#2a2825;--ac:#b4524a;--br:#b69a64;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.7 'IBM Plex Sans Thai','Sarabun','Noto Sans Thai',system-ui,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:'Noto Serif Thai','Noto Serif',Georgia,serif;font-weight:500;margin:0;letter-spacing:.01em}
h2{font-size:19px;margin-bottom:4px}
h3{font-size:15px;margin:10px 0 6px}
.n,b.n,.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px}
header{padding:20px 16px 8px;max-width:880px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
header h1{font-size:22px}header p{margin:2px 0 0;color:var(--mt);font-size:13px}
.ctl{display:flex;gap:6px;flex-wrap:wrap}
button,select,input,textarea{font:inherit;color:inherit}
.btn{background:none;border:1px solid var(--ln);border-radius:4px;padding:5px 10px;cursor:pointer;font-size:13px}
.btn:hover,.btn.on{border-color:var(--br);color:var(--br)}
nav{max-width:880px;margin:0 auto;padding:0 16px;display:flex;gap:20px;overflow-x:auto;border-bottom:1px solid var(--ln)}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 0;color:var(--mt);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--tx);border-color:var(--ac)}
main{max-width:880px;margin:0 auto;padding:16px}
.tab{display:none}.tab.on{display:block}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:16px;margin-bottom:16px}
.sub{color:var(--mt);font-size:13px;margin:0 0 12px}
.tr{margin:14px 0;padding-bottom:10px;border-bottom:1px solid var(--ln)}
.trh{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.trh b{font-weight:400;color:var(--br)}
input[type=range]{width:100%;accent-color:var(--ac);height:28px}
select,input[type=number],input[type=text],textarea{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:4px;padding:8px;font-size:14px}
label{display:block;font-size:13px;color:var(--mt);margin:10px 0 4px}
.res{border-left:2px solid var(--ac);padding:4px 0 4px 12px;margin-top:14px}
.res .big{font-family:'Noto Serif Thai',serif;font-size:20px}
.warn{color:var(--br);font-size:13px;margin-top:6px;line-height:1.55}
.warning-panel{border:1px solid var(--br);background:var(--bg);border-radius:6px;padding:12px;margin-top:12px}
.info-box{background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:12px;margin-top:10px;font-size:13px;line-height:1.6}
.ph{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}
.ph .btn{padding:8px 0;text-align:center}
.c{color:var(--br);font-size:11px;vertical-align:super;cursor:pointer;margin-left:2px;text-decoration:none}
ol{padding-left:20px}ol li{margin-bottom:10px;font-size:14px}
.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--ln);padding:7px 0;font-size:14px}
.row span:first-child{color:var(--mt)}.row span:last-child{text-align:right}
.disc{font-size:12px;color:var(--mt);border-top:1px solid var(--ln);padding-top:12px;margin-top:8px}
#cv{width:100%;height:min(68vh,540px);display:block;touch-action:none;cursor:grab;background:radial-gradient(circle at 50% 40%,var(--sf),var(--bg) 75%);border-radius:4px}.vb{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
@media print{body{background:#fff!important;color:#000!important}.np{display:none!important}.card{background:#fff!important;border-color:#bbb!important}.tab{display:none!important}#t-report{display:block!important}.row span:first-child,.sub{color:#444!important}}
</style>
</head>
<body>
<header class="np">
<div><h1>Osteo-Intel</h1><p id="tag"></p></div>
<div class="ctl">
  <button class="btn" onclick="resetAll()">↺ Reset</button>
  <button class="btn" id="bth" onclick="setLang('th')">ไทย</button>
  <button class="btn" id="ben" onclick="setLang('en')">EN</button>
  <button class="btn" onclick="toggleTheme()" id="bt">◐</button>
</div>
</header>
<nav class="np" id="nav"></nav>
<main id="v"></main>
<script>
var lang='th';
var S={
  t:{},
  fem:0,
  age:0,
  tg:'TM',
  sbSex:'m',
  sbPh:3,
  mech:'bft',
  wx:0,
  preservation:'complete',
  an:'',
  op:'',
  out:{}
};
var T=function(a,b){return lang==='th'?a:b};
var $=function(i){return document.getElementById(i)};
function esc(v){
  return String(v==null?'':v)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}
var TR=[
  ['sci','p',5,'Greater sciatic notch','รอยเว้าไซอาติกใหญ่','Walker 2005'],
  ['ven','p',2,'Ventral arc','ventral arc','Phenice 1969'],
  ['sub','p',2,'Subpubic concavity','subpubic concavity','Phenice 1969'],
  ['ram','p',2,'Medial ischiopubic ramus','ischiopubic ramus','Phenice 1969'],
  ['nuc','c',5,'Nuchal crest','สันท้ายทอย','Buikstra 1994'],
  ['mas','c',5,'Mastoid process','ปุ่มกกหู','Buikstra 1994'],
  ['sup','c',5,'Supraorbital margin','ขอบเบ้าตาบน','Buikstra 1994'],
  ['gla','c',5,'Glabella','กลางหน้าผาก','Buikstra 1994'],
  ['men','c',5,'Mental eminence','ปุ่มคาง','Buikstra 1994']
];
var SB={
  m:[[18.5,2.1,15,23],[23.4,3.6,19,34],[28.7,6.5,21,46],[35.2,9.4,23,57],[45.6,10.4,27,66],[61.2,12.2,34,86]],
  f:[[19.4,2.6,15,24],[25.0,4.9,19,40],[30.7,8.1,21,53],[38.2,10.9,26,70],[48.1,14.6,25,83],[60.0,12.4,42,87]]
};
var SBF=[
  ['สันและร่องชัด ยังไม่มีขอบ','Billowing ridges and furrows; no rim'],
  ['สันยังอยู่ เริ่มมีปุ่มกระดูกและขอบบน','Ridges persist; ossific nodules; rim begins'],
  ['สันหายไป ลานด้านหลังสมบูรณ์ ขอบด้านท้องกำลังก่อตัว','Ridges gone; dorsal plateau complete; ventral rim forming'],
  ['ผิวละเอียด โครงรูปไข่ครบ ขอบชัด','Fine-grained face; oval outline; rim defined'],
  ['ขอบสมบูรณ์ ผิวเริ่มเว้า เริ่มสึก','Rim complete; face slightly depressed; early breakdown'],
  ['ผิวกร่อน มีรูพรุนและงอกผิดรูป','Erosion, porosity and irregular outgrowths']
];
var TG={
  TM:[2.47,54.99,3.88,'Mahakkanukrauh et al. 2011 · Thai Male','ชายไทย (Mahakkanukrauh 2011)','Mahakkanukrauh P, et al. (2011) Forensic Sci Int 210:279.e1–7.'],
  TF:[2.41,56.40,3.75,'Mahakkanukrauh et al. 2011 · Thai Female','หญิงไทย (Mahakkanukrauh 2011)','Mahakkanukrauh P, et al. (2011) Forensic Sci Int 210:279.e1–7.'],
  AM:[2.15,72.57,3.80,'Trotter 1970 · Asian Male','ชาย Asian (Trotter 1970)','Trotter M (1970) Personal Identification in Mass Disasters.'],
  WM:[2.38,61.41,3.27,'Trotter 1970 · White Male','ชายกลุ่ม “White” (Trotter 1970)','Trotter M (1970) Personal Identification in Mass Disasters.'],
  WF:[2.47,54.10,3.72,'T&G 1952 · White Female','หญิงกลุ่ม “White” (T&G 1952)','Trotter M, Gleser GC (1952) Am J Phys Anthropol 10:463–514.'],
  BM:[2.11,70.35,3.94,'T&G 1952 · Black Male','ชายกลุ่ม “Black” (T&G 1952)','Trotter M, Gleser GC (1952) Am J Phys Anthropol 10:463–514.'],
  BF:[2.28,59.76,3.41,'T&G 1952 · Black Female','หญิงกลุ่ม “Black” (T&G 1952)','Trotter M, Gleser GC (1952) Am J Phys Anthropol 10:463–514.']
};
var MECH={
  bft:[['แรงกระแทกทู่ (blunt)','Blunt force'],['รอยแตกแนวรัศมีและวงซ้อน; ตามกฎ Puppe รอยแตกใหม่จะหยุดที่รอยเดิม','Radiating and concentric fractures; by Puppe’s rule newer fractures terminate at older ones']],
  sft:[['วัตถุมีคม (sharp)','Sharp force'],['ผนัง kerf เรียบ รอยขูด (striae) พื้นแบน; แยกการฟัน/การกรีดจากรูปร่าง kerf','Smooth kerf walls, striae, flat floor; separate chop from incision by kerf shape']],
  gsw:[['กระสุน (ballistic)','Ballistic'],['ทางเข้าเป็นรูปปากแตรด้านใน ทางออกปากแตรด้านนอก','Entrance beveled internally, exit beveled externally']],
  tap:[['ทาโฟโนมี (หลังตาย)','Taphonomic'],['รอยรากไม้ รอยแทะสัตว์ฟันแทะ (ร่องคู่) รอยเขี้ยว คราบดิน การผุกร่อนจากอากาศ','Root etching, rodent gnawing (paired grooves), carnivore punctures, soil staining, weathering']]
};
var WX=[
  ['ไม่ผุกร่อน ยังมีไขมันที่ผิว','Unweathered; greasy surface'],
  ['รอยร้าวเล็กขนานเส้นใย','Fine cracking parallel to fibers'],
  ['ผิวชั้นนอกลอกเป็นแผ่น','Outer layer flaking'],
  ['ผิวหยาบ กระดูกแข็งเป็นเส้นใย ลึกราว 1–1.5 มม.','Rough fibrous bone; weathering to ~1–1.5 mm'],
  ['ผิวหยาบมาก เสี้ยนหลุดง่าย','Coarse surface; splinters loosen'],
  ['กระดูกแตกสลายอยู่กับที่','Bone disintegrating in place']
];
var REFS=[
  'Buikstra JE, Ubelaker DH (1994) Standards for Data Collection from Human Skeletal Remains. Arkansas Archeological Survey Research Series 44.',
  'Phenice TW (1969) A newly developed visual method of sexing the os pubis. Am J Phys Anthropol 30:297–301.',
  'Trotter M, Gleser GC (1952) Estimation of stature from long bones of American Whites and Negroes. Am J Phys Anthropol 10:463–514.',
  'Trotter M (1970) Estimation of stature from intact long limb bones. In: TD Stewart (ed) Personal Identification in Mass Disasters, pp. 71–83.',
  'Brooks S, Suchey JM (1990) Skeletal age determination based on the os pubis. Human Evolution 5:227–238.',
  'Mahakkanukrauh P, et al. (2011) Stature estimation from long bone lengths in a Thai population. Forensic Sci Int 210:279.e1–7.',
  'Behrensmeyer AK (1978) Taphonomic and ecologic information from bone weathering. Paleobiology 4:150–162.',
  'Sauer NJ (1998) The timing of injuries and manipulation of the body. In: Reichs KJ (ed) Forensic Osteology, 2nd ed. Charles C Thomas.',
  'Walker PL (2005) Greater sciatic notch morphology: sex, age, and population differences. Am J Phys Anthropol 127:385–391.',
  'İşcan MY, Loth SR, Wright RK (1984) Age estimation from the rib by phase analysis: white males. J Forensic Sci 29:1094–1104.'
];
function c(n){
  return '<a class="c" href="#ref-'+n+'" onclick="go(\'refs\');setTimeout(function(){var e=document.getElementById(\'ref-'+n+'\');if(e)e.scrollIntoView({behavior:\'smooth\',block:\'center\'});},100);return false;">['+n+']</a>';
}
function go(t){
  document.querySelectorAll('.tab').forEach(function(e){e.classList.toggle('on',e.id==='t-'+t)});
  document.querySelectorAll('#nav button').forEach(function(e){e.classList.toggle('on',e.dataset.t===t)});
  if(t==='report')rep();
  if(t==='atlas')initAtlas();
  window.scrollTo(0,0);
}
function setLang(l){lang=l;document.documentElement.lang=l;build()}
function toggleTheme(){var h=document.documentElement;var cur=h.dataset.theme;h.dataset.theme=cur==='dark'?'light':'dark'}
function resetAll(){
  if(confirm(T(
    'คุณต้องการรีเซ็ตข้อมูลการวิเคราะห์ทั้งหมดหรือไม่?',
    'Reset all analytical data?'
  ))){
    S={
      t:{},
      fem:0,
      age:0,
      tg:'TM',
      sbSex:'m',
      sbPh:3,
      mech:'bft',
      wx:0,
      preservation:'complete',
      an:'',
      op:'',
      out:{}
    };
    build();
    calc();
    tc();
  }
}
function build(){
  $('tag').textContent=T('โต๊ะฝึกวิเคราะห์โครงกระดูกทางนิติมานุษยวิทยา','Forensic anthropology training bench');
  $('bth').classList.toggle('on',lang==='th');$('ben').classList.toggle('on',lang==='en');
  var tabs=[['profile',T('โปรไฟล์ชีวภาพ','Biological profile')],['atlas',T('แบบจำลอง 3 มิติ','3D atlas')],['trauma',T('บาดแผลและทาโฟโนมี','Trauma & taphonomy')],['report',T('รายงาน','Report')],['refs',T('อ้างอิง','References')]];
  var cur=(document.querySelector('.tab.on')||{id:'t-profile'}).id.slice(2);
  $('nav').innerHTML=tabs.map(function(x){return '<button data-t="'+x[0]+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>'}).join('');
  var tr=function(g){return TR.filter(function(x){return x[1]===g}).map(function(x){
    var k=x[0];var v=S.t[k]||0;
    return '<div class="tr"><div class="trh"><span>'+esc(x[3])+(x[4]&&lang==='th'?' <span style="color:var(--mt)">'+esc(x[4])+'</span>':'')+' <span style="color:var(--mt);font-size:12px">['+esc(x[5])+']</span></span><b class="n" id="v_'+k+'"></b></div><input type="range" min="0" max="'+x[2]+'" value="'+v+'" aria-label="'+esc(x[3])+'" oninput="S.t.'+k+'=+this.value;calc()"></div>';
  }).join('')};
  var tgo=Object.keys(TG).map(function(k){return '<option value="'+k+'"'+(S.tg===k?' selected':'')+'>'+esc(T(TG[k][4],TG[k][3]))+'</option>'}).join('');
  var ph=[1,2,3,4,5,6].map(function(i){return '<button class="btn n'+(S.sbPh===i?' on':'')+'" onclick="S.sbPh='+i+';build();calc()">'+['I','II','III','IV','V','VI'][i-1]+'</button>'}).join('');
  var mo=Object.keys(MECH).map(function(k){return '<option value="'+k+'"'+(S.mech===k?' selected':'')+'>'+esc(T(MECH[k][0][0],MECH[k][0][1]))+'</option>'}).join('');
  var wo=WX.map(function(w,i){return '<option value="'+i+'"'+(S.wx==i?' selected':'')+'>'+esc(T('ระยะ ','Stage ')+i+' · '+T(w[0],w[1]))+'</option>'}).join('');
  $('v').innerHTML=
  '<section class="tab" id="t-profile">'+
  '<div class="card"><h2>'+T('1. ประเมินเพศ (Sex Estimation)','1. Sex estimation')+c(1)+c(2)+c(9)+'</h2>'+
  '<p class="sub">'+T(
  'บันทึกลักษณะทางสัณฐานวิทยาตามวิธีที่เลือก โดยคะแนนแต่ละลักษณะเป็น ordinal observation ไม่ใช่ค่าความน่าจะเป็นของเพศ · 0 = ไม่ได้ให้คะแนน/ไม่นำมาคิด · Phenice ใช้ 1 = หญิง, 2 = ชาย; ลักษณะเกณฑ์ 1–5 ใช้ 1 = ลักษณะแบบหญิง, 5 = ลักษณะแบบชาย',
  'Record morphological traits using the selected method. Trait scores are ordinal observations, not probabilities. 0 = not scored/excluded · Phenice traits: 1 = female, 2 = male; 1–5 traits: 1 = female-typical, 5 = male-typical.'
  )+'</p>'+
  '<label>'+T('สภาพการอนุรักษ์กระดูก (Preservation status)','Preservation status')+'</label>'+
  '<select onchange="S.preservation=this.value;calc()">'+
    '<option value="complete"'+(S.preservation==='complete'?' selected':'')+'>'+T('สมบูรณ์ (Complete)','Complete')+'</option>'+
    '<option value="partial"'+(S.preservation==='partial'?' selected':'')+'>'+T('สมบูรณ์บางส่วน (Partial)','Partial')+'</option>'+
    '<option value="poor"'+(S.preservation==='poor'?' selected':'')+'>'+T('ผุกร่อนมาก (Poor / severely weathered)','Poor / severely weathered')+'</option>'+
  '</select>'+
  '<div style="margin-top:10px"><b>'+T('กระดูกเชิงกราน','Pelvis')+'</b> '+c(2)+c(9)+tr('p')+'</div>'+
  '<div style="height:8px"></div><b>'+T('กะโหลกศีรษะ','Cranium')+'</b> '+c(1)+tr('c')+
  '<div class="res">'+
    '<div class="big" id="sx"></div>'+
    '<div class="warn" id="sw"></div>'+
    '<div class="info-box" id="sdetail"></div>'+
    '<div class="info-box" id="sinterpret"></div>'+
  '</div></div>'+
  '<div class="card"><h2>'+T('2. ส่วนสูง','2. Stature')+c(3)+c(4)+c(6)+'</h2><p class="sub">'+T('คำนวณค่าประมาณส่วนสูงจากความยาวสูงสุดของกระดูกต้นขา (femur) ในหน่วยมิลลิเมตร','Estimate living stature from maximum femur length in millimetres.')+'</p>'+
  '<label>'+T('สมการ','Model')+'</label><select onchange="S.tg=this.value;calc()">'+tgo+'</select>'+
  '<label>'+T('ความยาวสูงสุดของ femur (มม.)','Maximum femur length (mm)')+'</label><input type="number" inputmode="decimal" value="'+(S.fem||'')+'" oninput="S.fem=+this.value;calc()">'+
  '<div class="res"><div class="big" id="st">—</div><div class="sub" id="st2"></div><div class="info-box" id="st_eq"></div></div>'+
  '<p class="sub" style="margin-top:10px">'+T('สมการแต่ละชุดมาจากกลุ่มตัวอย่างอ้างอิงเฉพาะ ควรตรวจสอบความเหมาะสมกับประชากรและบริบทของคดีก่อนนำไปใช้','Equations derive from specific reference samples; verify suitability for the population and case context before use.')+c(6)+'</p></div>'+
  '<div class="card"><h2>'+T('3. อายุขณะเสียชีวิต','3. Age at death')+c(5)+'</h2><p class="sub">Suchey-Brooks '+T('(ใช้ตารางแยกเพศ)','(sex-specific tables)')+'</p>'+
  '<select onchange="S.sbSex=this.value;calc()"><option value="m"'+(S.sbSex==='m'?' selected':'')+'>'+T('ตารางชาย','Male table')+'</option><option value="f"'+(S.sbSex==='f'?' selected':'')+'>'+T('ตารางหญิง','Female table')+'</option></select>'+
  '<div class="ph">'+ph+'</div><div class="res"><div class="big n" id="ag"></div><div class="sub" id="ag2"></div></div></div>'+
  '</section>'+
  '<section class="tab" id="t-atlas"><div class="card"><h2>'+T('แบบจำลองโครงกระดูก 3 มิติ','3D skeleton atlas')+'</h2><p class="sub">'+T(

  'Schematic educational model for approximate anatomical orientation. Not anatomically validated and not a substitute for examination of actual evidence. Drag to rotate, scroll to zoom, tap a bone for details.'

function calc(){
  var P=[], C=[];
  var unassessedP=[], unassessedC=[];
  var scoredTraits=[];
  TR.forEach(function(x){
    var v=S.t[x[0]]||0;
    var e=$('v_'+x[0]);
    if(e){
      e.textContent = v
        ? String(v)
        : T('ประเมินไม่ได้','Not scored');
    }
    if(v>0){
      scoredTraits.push({
        key:x[0],
        group:x[1],
        trait:T(x[4]||x[3],x[3]),
        score:v,
        method:x[5]
      });
      if(x[1]==='p') P.push(v);
      else C.push(v);
    }else{
      if(x[1]==='p')
        unassessedP.push(T(x[4]||x[3],x[3]));
      else
        unassessedC.push(T(x[4]||x[3],x[3]));
    }
  });
  var pelvisCount=P.length;
  var craniumCount=C.length;
  var totalCount=pelvisCount+craniumCount;
  var completeness=totalCount/9*100;
  var sexRes=T(
    'บันทึกข้อมูลลักษณะทางสัณฐานวิทยาแล้ว',
    'Morphological observations recorded'
  );
  var sexWarn=T(
    'ผลนี้เป็นการบันทึก trait observations ไม่ใช่ผลจำแนกเพศที่ผ่านการตรวจสอบความแม่นยำทางสถิติ',
    'This output records trait observations. It is not a statistically validated sex classification.'
  );
  if(S.preservation==='partial'){
    sexWarn+=T(
      ' กระดูกมีความสมบูรณ์บางส่วน ควรพิจารณาว่าลักษณะที่เหลือเพียงพอและเชื่อถือได้หรือไม่',
      ' Partial preservation may limit the reliability and applicability of observed traits.'
    );
  }
  if(S.preservation==='poor'){
    sexWarn+=T(
      ' กระดูกผุกร่อนมาก อาจส่งผลต่อการประเมิน morphology และไม่ควรฝืนตีความลักษณะที่เสียหาย',
      ' Severe weathering may compromise morphology. Do not score damaged or unreliable traits.'
    );
  }
  $('sx').textContent=sexRes;
  $('sw').textContent=sexWarn;
  $('sw').className=S.preservation!=='complete'?'warning-panel warn':'warn';
  var detail=
    '<b>'+T('ความครบถ้วนของข้อมูล','Data completeness')+'</b><br>'+
    T('เชิงกราน: ','Pelvis: ')+pelvisCount+'/4<br>'+
    T('กะโหลก: ','Cranium: ')+craniumCount+'/5<br>'+
    T('รวม: ','Total: ')+totalCount+'/9 ('+
    completeness.toFixed(0)+'%)';
  if(unassessedP.length){
    detail+='<p style="margin:6px 0 0">'+T('Pelvis ที่ไม่ได้ประเมิน: ','Unscored pelvis traits: ')+
      esc(unassessedP.join(', '))+'</p>';
  }
  if(unassessedC.length){
    detail+='<p style="margin:6px 0 0">'+T('Cranial traits ที่ไม่ได้ประเมิน: ','Unscored cranial traits: ')+
      esc(unassessedC.join(', '))+'</p>';
  }
  $('sdetail').innerHTML=detail;
  var traitSummary=scoredTraits.length
    ? scoredTraits.map(function(x){
        return '<div class="row">'+
          '<span>'+esc(x.trait)+'</span>'+
          '<span>'+esc(x.score)+' · '+esc(x.method)+'</span>'+
        '</div>';
      }).join('')
    : '<div class="sub" style="margin:6px 0 0">'+T('ยังไม่มี trait ที่บันทึก','No traits recorded yet')+'</div>';
  $('sinterpret').innerHTML=
    '<b>'+T('ผลการสังเกต','Recorded observations')+'</b>'+
    traitSummary;
  S.out.sex=sexRes;
  S.out.sexObservations=scoredTraits;
  S.out.sexCompleteness=completeness;
  S.out.sexLimitations=sexWarn;

  var M=TG[S.tg];
  var st='—';
  var s2='';
  var eqDetail='';
  if(M && S.fem>0){
    var femCm=S.fem/10;
    var finalH=M[0]*femCm+M[1];
    st=finalH.toFixed(1)+' cm';
    var inch=finalH/2.54;
    s2=Math.floor(inch/12)+' ft '+
       (inch%12).toFixed(1)+' in';
    eqDetail=
      '<b>'+T('สมการที่ใช้','Equation used')+'</b><br>'+
      '<span class="mono">Stature (cm) = '+
      M[0]+' × Femur ('+femCm.toFixed(2)+' cm) + '+
      M[1]+'</span><br>'+
      '<span class="mono">SEE = '+M[2]+' cm</span><br>'+
      '<div class="warn">'+T(
        'SEE เป็นค่าความคลาดเคลื่อนมาตรฐานของสมการ ไม่ใช่ช่วงความเชื่อมั่น 95% โดยตรง ควรตรวจสอบสมการและประชากรอ้างอิงจากเอกสารต้นฉบับ',
        'SEE is the standard error of estimate, not automatically a 95% prediction interval. Verify the original equation and reference population.'
      )+'</div>'+
      '<br><b>'+T('Reference model: ','Reference model: ')+'</b>'+
      esc(T(M[4],M[3]))+'<br>'+
      '<b>'+T('ข้อจำกัด: ','Limitations: ')+'</b>'+
      T(
        'ค่าประมาณขึ้นกับ reference population, biological sex, measurement protocol และความสมบูรณ์ของกระดูก',
        'Estimate depends on reference population, biological sex, measurement protocol and bone integrity.'
      );
  }else{
    eqDetail=T(
      'กรอกความยาวสูงสุดของ Femur เป็นมิลลิเมตรเพื่อคำนวณ',
      'Enter maximum femur length in millimetres.'
    );
  }
  $('st').textContent=st;
  $('st2').textContent=s2;
  $('st_eq').innerHTML=eqDetail;
  S.out.st=st;
  S.out.stMethod=M?T(M[4],M[3]):'';
  S.out.stEquation=M&&S.fem>0?
    M[0]+' × femur ('+(S.fem/10).toFixed(2)+' cm) + '+M[1]
    :'';
  S.out.stSEE=M&&S.fem>0?M[2]+' cm':'';
  S.out.stFemur=S.fem>0?S.fem:null;

  var d=SB[S.sbSex][S.sbPh-1];
  $('ag').textContent=d[2]+' – '+d[3]+T(' ปี',' yrs');
  $('ag2').textContent=T('ค่าเฉลี่ย ','Mean ')+d[0]+' ± '+d[1]+' · '+SBF[S.sbPh-1][lang==='th'?0:1];
  S.out.age=T('ระยะ ','Phase ')+['I','II','III','IV','V','VI'][S.sbPh-1]+': '+d[2]+'–'+d[3]+T(' ปี',' yrs');
}
function tc(){
  var m=MECH[S.mech||'bft'];
  if($('mdesc'))
    $('mdesc').textContent=T(m[1][0],m[1][1]);
  if(!$('te')) return;
  var e=$('te').value;
  var f=$('tf').value;
  var h=$('th').value;
  var p=$('tp').value;
  var observations=[];
  var interpretation;
  var limitation;
  if(h==='c'){
    interpretation=T(
      'สนับสนุนการบาดเจ็บก่อนเสียชีวิต (Antemortem)',
      'Findings support antemortem trauma'
    );
    observations.push(T(
      'พบ Callus / bone remodeling ซึ่งสนับสนุนการมีชีวิตอยู่หลังได้รับบาดเจ็บ',
      'Callus or bone remodeling supports survival after injury.'
    ));
  }else if(e==='r'){
    interpretation=T(
      'อาจเป็น Antemortem หากลักษณะมนเกิดจากการ remodeling',
      'Potential antemortem injury if rounding represents remodeling'
    );
    observations.push(T(
      'ลักษณะขอบมนต้องแยกจาก abrasion, erosion และ postmortem modification',
      'Rounded edges must be distinguished from abrasion, erosion and postmortem modification.'
    ));
  }else{
    interpretation=T(
      'ยังไม่สามารถกำหนดช่วงเวลาได้อย่างน่าเชื่อถือ',
      'Timing cannot be reliably determined'
    );
  }
  if(f==='f'){
    observations.push(T(
      'ลักษณะ fracture surface มี morphology ที่สอดคล้องกับ fresh-bone response',
      'Fracture morphology is consistent with fresh-bone response.'
    ));
  }else{
    observations.push(T(
      'ลักษณะ fracture surface มี morphology ที่สอดคล้องกับ dry-bone fracture',
      'Fracture morphology is consistent with dry-bone fracture.'
    ));
  }
  if(e==='s'){
    observations.push(T(
      'สีของขอบรอยแตกใกล้เคียงผิวกระดูกโดยรอบ',
      'Fracture edge colour resembles the surrounding bone surface.'
    ));
  }else if(e==='l'){
    observations.push(T(
      'ขอบรอยแตกมีสีอ่อนกว่าหรือมี staining แตกต่างจากผิวรอบนอก',
      'Fracture edge is lighter or differently stained than adjacent cortex.'
    ));
  }
  if(p==='y'){
    observations.push(T(
      'พบ Plastic deformation ซึ่งอาจสนับสนุนพฤติกรรมของกระดูกสด แต่ไม่ใช่หลักฐานระบุเวลาการตายโดยลำพัง',
      'Plastic deformation may support fresh-bone behavior but is not independently diagnostic of timing.'
    ));
  }
  if(h==='c' && f==='d'){
    limitation=T(
      'พบ Healing response แต่ fracture morphology มีลักษณะ dry-bone response ควรพิจารณาว่าเป็นคนละเหตุการณ์ หรือมี postmortem damage เพิ่มเติมหรือไม่',
      'Healing is present but fracture morphology suggests dry-bone response. Consider multiple events or additional postmortem damage.'
    );
  }else if(h!=='c' && e==='s' && f==='f'){
    limitation=T(
      'ลักษณะสอดคล้องกับ fresh-bone response แต่ไม่สามารถระบุว่าเกิดในช่วง perimortem โดยปราศจากบริบทอื่น',
      'Fresh-bone response does not independently establish perimortem timing.'
    );
  }else{
    limitation=T(
      'ควรพิจารณาตำแหน่งรอยแตก รูปแบบการกระจาย กลไกแรง สภาพแวดล้อม และหลักฐานบริบทอื่นร่วมกัน',
      'Interpret with fracture location, distribution, mechanism, environment and contextual evidence.'
    );
  }
  $('tt').textContent=interpretation;
  $('tw').innerHTML=
    observations.map(function(x){
      return '<li>'+esc(x)+'</li>';
    }).join('')+
    '<li class="warn">'+esc(limitation)+'</li>';
  S.out.tm=interpretation;
  S.out.traumaObservations=observations;
  S.out.traumaLimitations=limitation;
  S.out.mech=T(m[0][0],m[0][1]);
  var wxIdx=Number(S.wx)||0;
  var wxText=T(WX[wxIdx][0],WX[wxIdx][1]);
  S.out.wx=T('ระยะ ','Stage ')+wxIdx+' · '+wxText;
  if($('wxdesc')){
    $('wxdesc').textContent=T('ระยะ ','Stage ')+wxIdx+': '+wxText;
  }
}

    );
  }
  if(o.traumaObservations){
    observations.push(
      '<h3>'+T('Trauma observations','Trauma observations')+'</h3>'+
      '<ul style="padding-left:18px;margin:6px 0">'+o.traumaObservations.map(function(x){

      }).join('')+'</ul>'
    );
  }
  if(o.sexLimitations){
    observations.push(
      '<div class="warn">'+esc(o.sexLimitations)+'</div>'
    );
  }
  if(o.traumaLimitations){
    observations.push(
      '<div class="warn">'+esc(o.traumaLimitations)+'</div>'

  $('rb').innerHTML+=
    '<div class="info-box">'+observations.join('')+'</div>'+

      '<b>'+T('ข้อจำกัดและบันทึกผู้วิเคราะห์','Analyst notes and limitations')+'</b><br>'+
      esc(S.op||T('ไม่มีบันทึก','No notes'))+
    '</div>';
